
name: RJS-P1 Prime Numbers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-prime-program:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Prime Number Program
        run: node prime.js
